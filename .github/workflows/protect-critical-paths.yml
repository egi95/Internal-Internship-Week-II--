name: Protect critical paths
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'critical-folder/**'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Allowlist check
        run: |
          ALLOWED_USERS="egi95"
          ACTOR="${{ github.actor }}"
          if [[ "$ALLOWED_USERS" != *"$ACTOR"* ]]; then
            echo "Only [$ALLOWED_USERS] may modify protected paths. Actor: $ACTOR"
            exit 1
          fi
