name: Auto-Wipe Main Branch on Push

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  wipe:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Auto-delete all files and folders except .github/workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "🚨 Backing up .github/workflows if it exists..."
          if [ -d ".github/workflows" ]; then
            mkdir -p _temp_workflow_backup
            cp -r .github/workflows _temp_workflow_backup/
          fi

          echo "🧹 Deleting everything except .git and .github"
          shopt -s dotglob
          for item in * .*; do
            case "$item" in
              "."|".."|".git"|".github"|"_temp_workflow_backup") continue ;;
              *) rm -rf -- "$item" ;;
            esac
          done

          echo "♻️ Restoring workflow if backup exists..."
          if [ -d "_temp_workflow_backup/workflows" ]; then
            rm -rf .github/workflows || true
            mkdir -p .github
            mv _temp_workflow_backup/workflows .github/
          fi
          rm -rf _temp_workflow_backup

          git add -A
          git commit -m "Auto-wipe: ndryshimet tuaja jane fshire per shkak se nuk lejohet te shtohet ndonje file/folder ne main branch" || echo "Nothing to commit"
          git push origin HEAD:main --force
