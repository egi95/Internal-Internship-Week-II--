name: Protect .github
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fail if .github/** changed by non-egi95
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^\.github/')
          if [ -n "$CHANGED" ] && [ "${{ github.actor }}" != "egi95" ]; then
            echo "Only egi95 may modify .github/**. Actor: ${{ github.actor }}"
            exit 1
          fi
          echo "OK"
